# ==============================================================================
# Frontend UI - Deployment + Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
    app.kubernetes.io/component: frontend-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
        app.kubernetes.io/name: lang-agent
        app.kubernetes.io/component: frontend-ui
    spec:
      containers:
        - name: frontend-ui
          image: lang-agent/frontend-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api-backend:8000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
---
# ==============================================================================
# Frontend UI - Service (ClusterIP for internal access)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
    app.kubernetes.io/component: frontend-ui
spec:
  type: ClusterIP
  selector:
    app: frontend-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
