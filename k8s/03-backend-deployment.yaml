# ==============================================================================
# API Backend - Deployment + Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
    app.kubernetes.io/component: api-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
        app.kubernetes.io/name: lang-agent
        app.kubernetes.io/component: api-backend
    spec:
      containers:
        - name: api-backend
          image: lang-agent/api-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: lang-agent-config
            - secretRef:
                name: lang-agent-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2560Mi"
            limits:
              cpu: "2000m"
              memory: "5120Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/data/chroma_db
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-pvc
---
# ==============================================================================
# API Backend - Service (ClusterIP for internal access)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-backend
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
    app.kubernetes.io/component: api-backend
spec:
  type: ClusterIP
  selector:
    app: api-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
