# ==============================================================================
# Secrets - API Keys and Email credentials (base64 encoded)
# ==============================================================================
# IMPORTANT: Before applying, encode your real values with:
#   echo -n "your_value" | base64
# Replace the placeholder values below.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lang-agent-secrets
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
type: Opaque
data:
  GROQ_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  OPENROUTER_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  HF_TOKEN: REPLACE_WITH_BASE64_ENCODED_VALUE
  SENDER_EMAIL: REPLACE_WITH_BASE64_ENCODED_VALUE
  SENDER_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  RECIPIENT_EMAIL: REPLACE_WITH_BASE64_ENCODED_VALUE
---
# ==============================================================================
# ConfigMap - Non-sensitive configuration
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: lang-agent-config
  namespace: lang-agent
  labels:
    app.kubernetes.io/name: lang-agent
data:
  CHROMA_DB_PATH: "/app/data/chroma_db"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  OPENAI_API_KEY: "your_openai_api_key_here"
