events {
    worker_connections 1024;
}

http {
    # ─── Upstream definitions ───────────────────────────────
    upstream api_backend {
        least_conn;
        server api-backend:8000;
    }

    upstream frontend_ui {
        server frontend-ui:3000;
    }

    # ─── Rate limiting zone ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ─── Main server ────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://lang-agent-asser.duckdns.org; media-src 'self' blob:;" always;

        # ─── API Backend ────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeouts for LLM processing
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;

            # Allow large file uploads (OCR images)
            client_max_body_size 10M;
        }

        # ─── Health check endpoint ──────────────────────────
        location /health {
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
        }

        # ─── Frontend (Next.js) ─────────────────────────────
        location / {
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR (dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ─── Monitoring dashboards ──────────────────────────
        location /grafana/ {
            proxy_pass http://grafana:3001/;
            proxy_set_header Host $host;
        }
    }
}
