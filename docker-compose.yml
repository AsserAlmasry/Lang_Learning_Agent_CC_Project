# ==============================================================================
# Language Learning Agent - Docker Compose (Production)
# ==============================================================================
# Multi-container orchestration with resource limits, health checks,
# persistent storage, and monitoring stack.
# ==============================================================================

services:
  # ─── 1. API Backend (FastAPI) ──────────────────────────────────────────────
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lang-api-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - chroma_data:/app/data/chroma_db
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5G
        reservations:
          cpus: "1.0"
          memory: 2560M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "com.lang-agent.service=api-backend"
      - "com.lang-agent.tier=backend"

  # ─── 2. Frontend (Next.js) ─────────────────────────────────────────────────
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lang-frontend-ui
    restart: unless-stopped
    environment: []
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      api-backend:
        condition: service_healthy
    labels:
      - "com.lang-agent.service=frontend-ui"
      - "com.lang-agent.tier=frontend"

  # ─── 3. ChromaDB (Vector Database) ────────────────────────────────────────
  chroma-db:
    image: chromadb/chroma:latest
    container_name: lang-chroma-db
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.lang-agent.service=chroma-db"
      - "com.lang-agent.tier=database"

  # ─── 4. NGINX Reverse Proxy & Load Balancer ───────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: lang-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      api-backend:
        condition: service_healthy
      frontend-ui:
        condition: service_started
    labels:
      - "com.lang-agent.service=nginx-proxy"
      - "com.lang-agent.tier=proxy"

  # ─── 5. Prometheus (Metrics Collection) ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: lang-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      - "com.lang-agent.service=prometheus"
      - "com.lang-agent.tier=monitoring"

  # ─── 6. Grafana (Live Monitoring Dashboard) ────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: lang-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=avs5g962HaY2IpIJZgQvyg
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - prometheus
    labels:
      - "com.lang-agent.service=grafana"
      - "com.lang-agent.tier=monitoring"

  # ─── 7. cAdvisor (Container Metrics Exporter) ─────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: lang-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - "com.lang-agent.service=cadvisor"
      - "com.lang-agent.tier=monitoring"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ─── Volumes (Persistent Storage) ────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
