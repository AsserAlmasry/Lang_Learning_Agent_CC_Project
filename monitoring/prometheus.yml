# ==============================================================================
# Prometheus Configuration - Language Learning Agent
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ─── cAdvisor (Container CPU/RAM/Network metrics) ──────────────────────────
  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_lang_agent_service]
        target_label: service_name
      - source_labels: [container_label_com_lang_agent_tier]
        target_label: service_tier
